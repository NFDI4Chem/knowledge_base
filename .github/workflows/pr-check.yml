name: PR Check

on:
    pull_request:
        paths: &watched-paths
            - "docs/**"
            - "src/**"
            - "i18n/**"
            - "scripts/**"
            - "tests/**"
            - "static/**"
            - "*.json"
            - "*.js"
            - "*.ts"
            - "*.tsx"
            - "*.md"
            - "*.mdx"
            - "package.json"
            - "package-lock.json"
            - ".prettierignore"
            - ".github/actions/setup-node-env/action.yml"
            - ".github/workflows/pr-check.yml"
    push:
        branches:
            - main
            - localisation
        paths: *watched-paths
    workflow_dispatch:

jobs:
    content-check:
        name: Content Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node environment
              uses: ./.github/actions/setup-node-env

            - name: Run content check
              run: npm run test:content

    format-check:
        name: Format Check
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            has_fixes: ${{ steps.format.outputs.has_fixes }}

        steps:
            - name: Setup Node environment
              uses: ./.github/actions/setup-node-env
              with:
                  ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.ref }}

            - name: Detect changed lintable files
              id: changed-files
              uses: tj-actions/changed-files@v47
              with:
                  files: |
                      **/*.js
                      **/*.jsx
                      **/*.ts
                      **/*.tsx
                      **/*.md
                      **/*.mdx
                      **/*.json
                      **/*.css
                      **/*.yml
                      **/*.yaml
                  files_ignore: |
                      package-lock.json

            - name: Format changed files
              id: format
              if: steps.changed-files.outputs.any_changed == 'true'
              env:
                  CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
                  AUTO_FORMAT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
              shell: bash
              run: |
                  IFS=' ' read -r -a files <<< "$CHANGED_FILES"

                  if [[ "$AUTO_FORMAT" == "true" ]]; then
                      npx prettier --write -- "${files[@]}"
                      if ! git diff --quiet; then
                          git diff --binary > "$RUNNER_TEMP/prettier-fixes.patch"
                          echo "has_fixes=true" >> "$GITHUB_OUTPUT"
                      fi
                  else
                      npx prettier --check -- "${files[@]}"
                  fi

            - name: Upload formatting patch
              if: steps.format.outputs.has_fixes == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: prettier-fixes
                  path: ${{ runner.temp }}/prettier-fixes.patch
                  if-no-files-found: error
                  retention-days: 1

    format-fix-commit:
        name: Commit Format Fixes
        needs: format-check
        if: needs.format-check.outputs.has_fixes == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout pull request branch
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            - name: Download formatting patch
              uses: actions/download-artifact@v4
              with:
                  name: prettier-fixes
                  path: ${{ runner.temp }}

            - name: Apply patch and commit fixes
              shell: bash
              run: |
                  git apply --check "$RUNNER_TEMP/prettier-fixes.patch"
                  git apply --index "$RUNNER_TEMP/prettier-fixes.patch"

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git -c core.hooksPath=/dev/null commit -m "style: format changed files"

            - name: Create GitHub App token
              id: app-token
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ secrets.PRETTIER_APP_ID }}
                  private-key: ${{ secrets.PRETTIER_APP_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}
                  repositories: ${{ github.event.repository.name }}
                  permission-contents: write

            - name: Push Prettier fixes
              env:
                  PRETTIER_APP_TOKEN: ${{ steps.app-token.outputs.token }}
                  PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
              shell: bash
              run: |
                  auth_header="$(printf 'x-access-token:%s' "$PRETTIER_APP_TOKEN" | base64 -w 0)"
                  GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
                      git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
                      push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${PR_HEAD_REF}"

    js-check:
        name: JS Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node environment
              uses: ./.github/actions/setup-node-env

            - name: Run ESLint
              run: npm run test:js

    css-check:
        name: CSS Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node environment
              uses: ./.github/actions/setup-node-env

            - name: Run Stylelint
              run: npm run test:css

    build-validation:
        name: Build Validation
        if: github.event_name == 'pull_request'
        needs: [content-check, format-check, js-check, css-check]
        runs-on: ubuntu-latest
        env:
            HAS_CROWDIN_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN != '' }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node environment
              uses: ./.github/actions/setup-node-env

              # The following two steps will lead to inconsistencies when the PR is based on the localisation branch because the translations will only be done after the PR is merged into localisation. Therefore, we skip these steps in that case.
            - name: Write translations
              if: github.base_ref != 'localisation'
              run: npm run write-translations
              continue-on-error: false

            - name: Download translations from Crowdin
              if: github.base_ref != 'localisation' && env.HAS_CROWDIN_TOKEN == 'true'
              run: npm run crowdin download
              env:
                  CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
              continue-on-error: true

            - name: Build website
              shell: bash
              run: |
                  set -o pipefail
                  npm run build 2>&1 | tee build.log

            - name: Check build log for warnings and broken references
              shell: bash
              run: bash tests/ci/check-build-log.sh build.log
              continue-on-error: false

            - name: All checks passed
              if: success()
              run: |
                  echo "All validations succeeded!"
                  echo "- Content check passed"
                  echo "- Format check passed"
                  echo "- JS check passed"
                  echo "- CSS check passed"
                  echo "- Build succeeded"
