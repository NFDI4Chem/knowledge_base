name: PR Check

on:
    pull_request:
        paths: &watched-paths
            - "docs/**"
            - "src/**"
            - "i18n/**"
            - "scripts/**"
            - "tests/**"
            - "static/**"
            - "*.json"
            - "*.js"
            - "*.ts"
            - "*.tsx"
            - "*.md"
            - "*.mdx"
            - "package.json"
            - "package-lock.json"
            - ".prettierignore"
            - ".github/actions/setup-node-env/action.yml"
            - ".github/workflows/pr-check.yml"
    push:
        branches:
            - main
            - localisation
        paths: *watched-paths
    workflow_dispatch:

jobs:
    content-check:
        name: Content Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node environment
              uses: ./.github/actions/setup-node-env

            - name: Run content check
              run: npm run test:content

    format-check:
        name: Format Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node environment
              uses: ./.github/actions/setup-node-env

            - name: Detect changed lintable files
              id: changed-files
              uses: tj-actions/changed-files@v47
              with:
                  files: |
                      **/*.js
                      **/*.jsx
                      **/*.ts
                      **/*.tsx
                      **/*.md
                      **/*.mdx
                      **/*.json
                      **/*.css
                      **/*.yml
                      **/*.yaml
                  files_ignore: |
                      package-lock.json

            - name: Run format check on changed files
              if: steps.changed-files.outputs.any_changed == 'true'
              run: npx prettier --check ${{ steps.changed-files.outputs.all_changed_files }}

            - name: No changed lintable files
              if: steps.changed-files.outputs.any_changed != 'true'
              run: echo "No lintable files changed."

    js-check:
        name: JS Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node environment
              uses: ./.github/actions/setup-node-env

            - name: Run ESLint
              run: npm run test:js

    css-check:
        name: CSS Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node environment
              uses: ./.github/actions/setup-node-env

            - name: Run Stylelint
              run: npm run test:css

    build-validation:
        name: Build Validation
        if: github.event_name == 'pull_request'
        needs: [content-check, format-check, js-check, css-check]
        runs-on: ubuntu-latest
        env:
            HAS_CROWDIN_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN != '' }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node environment
              uses: ./.github/actions/setup-node-env

              # The following two steps will lead to inconsistencies when the PR is based on the localisation branch because the translations will only be done after the PR is merged into localisation. Therefore, we skip these steps in that case.
            - name: Write translations
              if: github.base_ref != 'localisation'
              run: npm run write-translations
              continue-on-error: false

            - name: Download translations from Crowdin
              if: github.base_ref != 'localisation' && env.HAS_CROWDIN_TOKEN == 'true'
              run: npm run crowdin download
              env:
                  CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
              continue-on-error: true

            - name: Build website
              shell: bash
              run: |
                  set -o pipefail
                  npm run build 2>&1 | tee build.log

            - name: Check build log for warnings and broken references
              shell: bash
              run: bash tests/ci/check-build-log.sh build.log
              continue-on-error: false

            - name: Upload build for smoke test
              uses: actions/upload-artifact@v7
              with:
                  name: site-build
                  path: build
                  retention-days: 1

            - name: All checks passed
              if: success()
              run: |
                  echo "All validations succeeded!"
                  echo "- Content check passed"
                  echo "- Format check passed"
                  echo "- JS check passed"
                  echo "- CSS check passed"
                  echo "- Build succeeded"

    smoke-test:
        name: Smoke Test
        if: github.event_name == 'pull_request'
        needs: [build-validation]
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node environment
              uses: ./.github/actions/setup-node-env

            - name: Download build
              uses: actions/download-artifact@v8
              with:
                  name: site-build
                  path: build

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install Playwright browser
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium

            - name: Install Playwright system dependencies
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps chromium

            - name: Run smoke test
              run: npm run test:e2e:smoke
              env:
                  PW_SKIP_BUILD: "true"
